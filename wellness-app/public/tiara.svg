<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tiara" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2C2A"/>
      <stop offset="1" stop-color="#2E1A19"/>
    </linearGradient>
    <clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50px 90px; }
    .tail { animation: sway 3.2s ease-in-out infinite; transform-origin: 70px 30px; }
    .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .spark { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark.b { animation-delay: 1.2s; }
    @keyframes bob { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-1.5px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .bob, .tail, .eye, .spark { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <path class="spark" d="M17 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
    <path class="spark b" d="M86 58l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
    <g class="bob">
      <!-- ponytail -->
      <g class="tail">
        <path d="M68 28c12 2 18 14 14 28-2 7-7 10-9 9 3-8 3-18-6-26z" fill="url(#hair)"/>
        <circle cx="70" cy="29" r="3.2" fill="#EC4899"/>
      </g>
      <!-- body / top -->
      <path d="M22 100c0-17 12-26 28-26s28 9 28 26z" fill="#EC4899"/>
      <path d="M40 76c3 4 7 6 10 6s7-2 10-6" fill="none" stroke="#DB2777" stroke-width="2" stroke-linecap="round"/>
      <!-- neck -->
      <rect x="44" y="64" width="12" height="13" rx="5" fill="#E8B48F"/>
      <!-- hair back -->
      <ellipse cx="50" cy="44" rx="23" ry="24" fill="url(#hair)"/>
      <!-- ears + earrings -->
      <circle cx="28.5" cy="49" r="4" fill="#F0C29E"/>
      <circle cx="71.5" cy="49" r="4" fill="#F0C29E"/>
      <circle cx="28.5" cy="55" r="1.6" fill="#A78BFA"/>
      <circle cx="71.5" cy="55" r="1.6" fill="#A78BFA"/>
      <!-- face -->
      <ellipse cx="50" cy="49" rx="20" ry="21" fill="#F6CDA8"/>
      <!-- bangs -->
      <path d="M29 44c0-14 9-22 21-22s21 8 21 22c-5-6-11-9-17-10 1 3 0 5-2 7-2-4-7-7-13-7-4 2-7 6-10 10z" fill="url(#hair)"/>
      <!-- brows -->
      <path d="M38 43q4-2.5 8 0M54 43q4-2.5 8 0" fill="none" stroke="#3B2220" stroke-width="1.6" stroke-linecap="round"/>
      <!-- eyes -->
      <g class="eye"><ellipse cx="42" cy="50" rx="2.6" ry="3.2" fill="#2B1B1A"/><circle cx="43" cy="48.8" r="0.9" fill="#fff"/></g>
      <g class="eye"><ellipse cx="58" cy="50" rx="2.6" ry="3.2" fill="#2B1B1A"/><circle cx="59" cy="48.8" r="0.9" fill="#fff"/></g>
      <!-- cheeks -->
      <ellipse cx="37" cy="57" rx="3.6" ry="2.2" fill="#F9A8D4" opacity=".75"/>
      <ellipse cx="63" cy="57" rx="3.6" ry="2.2" fill="#F9A8D4" opacity=".75"/>
      <!-- nose + smile -->
      <path d="M50 52.5v3" stroke="#D99A74" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M44.5 60q5.5 5 11 0" fill="#fff" stroke="#BE185D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
